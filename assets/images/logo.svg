<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%" aria-label="Shoreline Private Parking - Kayalpattinam Beach Logo">
  <defs>
    <linearGradient id="plugGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#0066CC" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A8FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Emblem: Stylized P + Cable Loop + Electric Plug -->
  <g transform="translate(10, 6)" filter="url(#glow)">
    <!-- Cable Loop Outer Wave -->
    <path d="M 68 38 C 76 38 82 46 82 56 C 82 72 65 82 45 82 C 22 82 8 72 8 52 C 8 28 26 12 52 12 C 68 12 78 18 78 18" 
          fill="none" stroke="#0099FF" stroke-width="5" stroke-linecap="round" />
    
    <!-- Stylized "P" -->
    <path d="M 28 20 L 52 20 C 62 20 68 25 68 33 C 68 41 62 46 52 46 L 39 46 L 39 74 L 28 74 Z M 39 29 L 39 37 L 50 37 C 54.5 37 57 35.5 57 33 C 57 30.5 54.5 29 50 29 Z" 
          fill="#0A2540" />
    
    <!-- Electric Plug Housing -->
    <g transform="translate(68, 38)">
      <rect x="0" y="4" width="20" height="24" rx="4" fill="url(#plugGlow)" stroke="#FFFFFF" stroke-width="2" />
      <!-- Prongs -->
      <rect x="20" y="8" width="5" height="4" rx="1" fill="#FFFFFF" />
      <rect x="20" y="20" width="5" height="4" rx="1" fill="#FFFFFF" />
      <!-- Lightning Bolt on Plug -->
      <polygon points="11,7 6,17 10,17 9,25 15,14 11,14" fill="url(#boltGrad)" />
    </g>
    
    <!-- Marine Wave Accent below P -->
    <path d="M 12 76 Q 30 68 48 76 T 84 76" fill="none" stroke="#00C49F" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(112, 16)">
    <!-- Brand Name (English) -->
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="#0A2540" letter-spacing="1.2">SHORELINE</text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0080FF" letter-spacing="2">PRIVATE PARKING</text>
    
    <!-- Tamil Translation Subtitle -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E65100" letter-spacing="0.5">தனியார் வாகனக் காப்பகம்</text>
    
    <!-- Location Badge -->
    <text x="1" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#00A896" letter-spacing="1">📍 KAYALPATTINAM BEACH</text>
  </g>
</svg>
